<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your iPhone upgrade configuration is complete and ready.">
  <title>All Set! | iPhone Upgrade Ready</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="success" style="background-color: var(--success-green);">

  <main class="success-viewport" role="main">
    <div class="success-content">
      
      <!-- Animated SVG Checkmark -->
      <div class="checkmark-container" aria-hidden="true">
        <svg class="checkmark-svg" viewBox="0 0 56 56">
          <circle class="checkmark-circle" cx="28" cy="28" r="25" />
          <path class="checkmark-check" d="M16 28l8 8 16-16" />
        </svg>
      </div>

      <h1 class="success-title">All Set!</h1>
      <p class="success-subtitle">Your iPhone upgrade is ready.</p>

      <!-- Configuration Summary Card -->
      <section class="summary-card" aria-label="Upgrade Summary">
        <div class="summary-card-header">Upgrade Summary</div>
        
        <div class="summary-row">
          <span class="summary-row-label">Current Device</span>
          <span class="summary-row-val" id="summary-old-model">iPhone 13</span>
        </div>

        <div class="summary-row">
          <span class="summary-row-label">Current Color</span>
          <span class="summary-row-val" id="summary-old-color">Midnight</span>
        </div>

        <div class="summary-row">
          <span class="summary-row-label">Current Storage</span>
          <span class="summary-row-val" id="summary-old-storage">128 GB</span>
        </div>

        <div class="summary-row" style="margin-top: 0.5rem; padding-top: 1rem; border-top: 1px solid rgba(255, 255, 255, 0.3);">
          <span class="summary-row-label">New Device</span>
          <span class="summary-row-val" id="summary-new-model" style="color: #FFFFFF;">iPhone 17 Pro Max</span>
        </div>

        <div class="summary-row">
          <span class="summary-row-label">New Finish</span>
          <span class="summary-row-val" id="summary-new-color">Cosmic Amber</span>
        </div>

        <div class="summary-row">
          <span class="summary-row-label">New Capacity</span>
          <span class="summary-row-val" id="summary-new-storage">512 GB</span>
        </div>
      </section>

      <!-- Start Over CTA Button -->
      <button type="button" class="btn-start-over" id="btn-start-over">
        <span>Start Over</span>
      </button>

    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
